[project]
name = "semgrep-list-php-projects"
version = "0.1.0"
description = "List the Semgrep projects that contain PHP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["semgrep", "php"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
# No dependencies, deliberately. HTTP is stdlib urllib and the CLI is argparse:
# this runs with an API token in its environment, so everything it imports is
# something the people running it have to vet.
dependencies = []

[project.urls]
Source = "https://github.com/semgrep/semgrep-list-php-projects"
Changelog = "https://github.com/semgrep/semgrep-list-php-projects/releases"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
semgrep-list-php-projects = "semgrep_list_php_projects.cli:main"

[tool.uv]
# Org policy: guard against newly-published malicious packages.
exclude-newer = "1 week"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["semgrep_list_php_projects"]
