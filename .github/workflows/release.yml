# Release on a version tag: v0.1.0 publishes
#   - ghcr.io/semgrep/semgrep-list-php-projects:0.1.0 (and :0.1, :latest),
#     for linux/amd64 and linux/arm64, with a signed build provenance
#     attestation (`gh attestation verify oci://... --owner semgrep`),
#   - semgrep-list-php-projects 0.1.0 on PyPI, through trusted publishing
#     (no API token in this repo; PyPI trusts this workflow's OIDC identity),
#   - a GitHub release carrying the wheel and sdist.
#
# One-time setup, outside this file:
#   - PyPI: add a trusted publisher for semgrep/semgrep-list-php-projects,
#     workflow release.yml, environment "pypi".
#   - GitHub: create the "pypi" environment (optionally with required reviewers)
#     and set the GHCR package to public after the first push.
#
# Every action is pinned to a full commit SHA (org policy): a tag is mutable.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    name: Tag matches every version string
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          fail=0
          check() {  # check <label> <value>
            if [ "$2" = "$version" ]; then echo "ok    $1: $2"; else echo "WRONG $1: $2 (tag says $version)"; fail=1; fi
          }
          check pyproject.toml "$(sed -nE 's/^version = "(.*)"$/\1/p' pyproject.toml)"
          check __init__.py    "$(sed -nE 's/^__version__ = "(.*)"$/\1/p' semgrep_list_php_projects/__init__.py)"
          check Dockerfile     "$(sed -nE 's/.*image\.version="(.*)".*/\1/p' Dockerfile)"
          check wrapper        "$(sed -nE 's/.*semgrep-list-php-projects:([0-9.]+)}".*/\1/p' semgrep-list-php-projects.sh)"
          check uv.lock        "$(awk '/^name = "semgrep-list-php-projects"$/{f=1} f && /^version = /{gsub(/"/,"",$3); print $3; exit}' uv.lock)"
          test "$fail" -eq 0
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    needs: check
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  image:
    name: Image to GHCR
    needs: [check, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.licenses=MIT
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  pypi:
    name: Package to PyPI
    needs: [check, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/semgrep-list-php-projects/${{ needs.check.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Build the wheel and sdist
        run: uv build
      - name: The wheel installs and runs on its own
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/check"
          uv pip install --python "$RUNNER_TEMP/check" dist/*.whl
          "$RUNNER_TEMP/check/bin/semgrep-list-php-projects" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      # Trusted publishing: no token. The action also uploads PEP 740
      # attestations, which pypi.org shows on the release's file list.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: GitHub release
    needs: [check, image, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ```bash
            uvx semgrep-list-php-projects==${{ needs.check.outputs.version }}
            docker run --rm -e SEMGREP_APP_TOKEN ${{ env.IMAGE }}:${{ needs.check.outputs.version }}
            ```

            Image digest: `${{ needs.image.outputs.digest }}`
            Verify: `gh attestation verify oci://${{ env.IMAGE }}:${{ needs.check.outputs.version }} --owner semgrep`
